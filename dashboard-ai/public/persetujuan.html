<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persetujuan — Cahaya Project</title>
<link rel="stylesheet" href="/app.css"></head>
<body>
<script src="/app.js"></script>
<script>
(function () {
  function muat() {
    Util.fetchJson("/api/persetujuan").then(function (data) {
      var drafts = data.drafts || [];
      var pr = data.pr || [];
      var html = "";
      // ---- Tugas PR (pitch / balasan outreach) ----
      for (var pi = 0; pi < pr.length; pi++) {
        var t = pr[pi];
        var h = t.hasil || {};
        var merah = h.kata_terlarang && h.kata_terlarang.length
          ? '<div class="pita-merah">⚠ Mengandung kata terlarang: ' + Util.esc(h.kata_terlarang.join(", ")) + " — jangan auto-kirim</div>"
          : "";
        html += '<div class="draft-lengkap" id="pr-' + t.id + '">' +
          '<div class="judul-kartu">' + Util.esc(t.judul) + "</div>" +
          '<div class="teks-redup">Jenis: ' + Util.esc(h.jenis || "pr") +
          " | Prospek #" + Util.esc(h.prospek_id) + "</div>" +
          '<div class="teks-redup">Subject: ' + Util.esc(h.subject || "-") + "</div>" +
          merah +
          '<div class="caption-lengkap">' + Util.esc(h.isi || t.isi || "") + "</div>" +
          '<div class="baris-tombol" style="margin-top:10px">' +
          '<button class="tombol tombol-hijau" data-ya-pr="' + t.id + '">Setujui & Kirim</button>' +
          '<button class="tombol tombol-merah" data-tidak-pr="' + t.id + '">Tolak</button></div>' +
          '<div class="kotak-alasan" id="alasan-pr-' + t.id + '" hidden>' +
          '<textarea id="teks-alasan-pr-' + t.id + '" placeholder="Alasan penolakan (wajib)..."></textarea>' +
          '<button class="tombol tombol-merah" data-kirim-tidak-pr="' + t.id + '" disabled>Kirim Penolakan</button></div>' +
          '<p class="pesan-sukses" id="hasil-pr-' + t.id + '" hidden></p>' +
          "</div>";
      }
      if (!drafts.length && !pr.length) {
        html = '<div class="kartu teks-redup">Tidak ada yang menunggu persetujuan.</div>';
      }
      for (var i = 0; i < drafts.length; i++) {
        var d = drafts[i];
        html += '<div class="draft-lengkap" id="draft-' + d.id + '">' +
          '<div class="judul-kartu" data-judul="' + d.id + '">' + Util.esc(d.judul) + "</div>" +
          '<div class="teks-redup">Akun tujuan: ' + Util.esc(d.akun_id) + " | Status: " + Util.statusBadge(d.status) +
          (d.alasan_tolak ? " | Alasan tolak: " + Util.esc(d.alasan_tolak) : "") + "</div>" +
          '<div class="caption-lengkap" data-caption="' + d.id + '">' + Util.esc(d.caption) + "</div>" +
          '<div class="teks-redup">Tagar: <span data-tagar="' + d.id + '">' + Util.esc((d.tagar || []).join(" ")) + "</span></div>" +
          // ===== Form edit (tersembunyi) =====
          '<div class="kotak-edit" id="edit-' + d.id + '" hidden style="margin-top:10px">' +
          '<input class="input-perintah" id="edit-judul-' + d.id + '" value="' + Util.esc(d.judul) + '" placeholder="Judul">' +
          '<textarea id="edit-caption-' + d.id + '" style="width:100%;min-height:120px;margin-top:8px">' + Util.esc(d.caption) + "</textarea>" +
          '<input class="input-perintah" id="edit-tagar-' + d.id + '" value="' + Util.esc((d.tagar || []).join(" ")) + '" placeholder="Tagar (pisah spasi)">' +
          '<div class="baris-tombol" style="margin-top:8px">' +
          '<button class="tombol tombol-hijau" data-simpan-edit="' + d.id + '">Simpan Perubahan</button>' +
          '<button class="tombol" data-batal-edit="' + d.id + '">Batal</button></div>' +
          "</div>" +
          // ===== Tombol aksi =====
          '<div class="baris-tombol" style="margin-top:10px">' +
          '<button class="tombol tombol-hijau" data-ya="' + d.id + '">Setujui</button>' +
          '<button class="tombol" data-edit="' + d.id + '">Edit</button>' +
          '<button class="tombol tombol-merah" data-tidak="' + d.id + '">Tolak</button></div>' +
          '<div class="kotak-alasan" id="alasan-' + d.id + '" hidden>' +
          '<textarea id="teks-alasan-' + d.id + '" placeholder="Alasan penolakan (wajib diisi)..."></textarea>' +
          '<button class="tombol tombol-merah" data-kirim-tidak="' + d.id + '" disabled>Kirim Penolakan</button></div>' +
          '<p class="pesan-sukses" id="hasil-' + d.id + '" hidden></p>' +
          "</div>";
      }
      Util.muatLayout("/persetujuan", html, "Persetujuan");
      pasangTombol();
    }).catch(function (e) {
      Util.muatLayout("/persetujuan", '<p class="pesan-error">' + Util.esc(e.message) + "</p>", "Persetujuan");
    });
  }

  function tampilPesan(id, teks, sukses) {
    var el = document.getElementById("hasil-" + id);
    if (!el) return;
    el.textContent = teks;
    el.className = sukses ? "pesan-sukses" : "pesan-error";
    el.hidden = false;
  }

  function pasangTombol() {
    // ---- Setujui ----
    document.querySelectorAll("[data-ya]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-ya");
        btn.disabled = true;
        tampilPesan(id, "Memproses gate & menjadwalkan...", true);
        Util.fetchJson("/api/persetujuan/" + id + "/ya", { method: "POST" })
          .then(function (r) {
            tampilPesan(id, "Terjadwal. schedule_id: " + Util.esc(r.scheduleId) + " pada " + Util.esc(r.scheduleAt), true);
            setTimeout(muat, 2500);
          })
          .catch(function (e) {
            btn.disabled = false;
            // Tampilkan pesan gate yang informatif (bukan "tidak bisa disetujui" yang membingungkan).
            var msg = e.message || "gagal menyetujui";
            if (e.gate && e.gate.blokir && e.gate.blokir.length) {
              msg += " | Blokir: " + e.gate.blokir.join("; ");
            }
            tampilPesan(id, msg, false);
          });
      });
    });

    // ---- Buka/tutup form edit ----
    document.querySelectorAll("[data-edit]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-edit");
        document.getElementById("edit-" + id).hidden = false;
      });
    });
    document.querySelectorAll("[data-batal-edit]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-batal-edit");
        document.getElementById("edit-" + id).hidden = true;
      });
    });

    // ---- Simpan edit ----
    document.querySelectorAll("[data-simpan-edit]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-simpan-edit");
        var judul = document.getElementById("edit-judul-" + id).value.trim();
        var caption = document.getElementById("edit-caption-" + id).value.trim();
        var tagar = document.getElementById("edit-tagar-" + id).value.trim();
        btn.disabled = true;
        Util.fetchJson("/api/draft/" + id, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ judul: judul, caption: caption, tagar: tagar }),
        })
          .then(function (r) {
            tampilPesan(id, "Perubahan tersimpan.", true);
            setTimeout(muat, 1200);
          })
          .catch(function (e) {
            btn.disabled = false;
            tampilPesan(id, e.message || "gagal menyimpan", false);
          });
      });
    });

    // ---- Setujui PR ----
    document.querySelectorAll("[data-ya-pr]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-ya-pr");
        btn.disabled = true;
        var el = document.getElementById("hasil-pr-" + id);
        el.textContent = "Mengirim email..."; el.className = "pesan-sukses"; el.hidden = false;
        Util.fetchJson("/api/persetujuan/" + id + "/ya", { method: "POST" })
          .then(function (r) {
            el.textContent = "Terkirim. resend_id: " + Util.esc(r.resend_id);
            setTimeout(muat, 2500);
          })
          .catch(function (e) {
            btn.disabled = false;
            el.textContent = e.message || "gagal mengirim"; el.className = "pesan-error";
          });
      });
    });

    // ---- Tolak PR ----
    document.querySelectorAll("[data-tidak-pr]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-tidak-pr");
        document.getElementById("alasan-pr-" + id).hidden = false;
      });
    });
    document.querySelectorAll("[data-kirim-tidak-pr]").forEach(function (btn) {
      var id = btn.getAttribute("data-kirim-tidak-pr");
      var ta = document.getElementById("teks-alasan-pr-" + id);
      ta.addEventListener("input", function () { btn.disabled = !ta.value.trim(); });
      btn.addEventListener("click", function () {
        btn.disabled = true;
        Util.fetchJson("/api/persetujuan/" + id + "/tidak", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ alasan: ta.value.trim() }),
        }).then(function () { setTimeout(muat, 1500); })
          .catch(function (e) { btn.disabled = false; });
      });
    });

    // ---- Tolak ----
    document.querySelectorAll("[data-tidak]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-tidak");
        document.getElementById("alasan-" + id).hidden = false;
      });
    });
    document.querySelectorAll("[data-kirim-tidak]").forEach(function (btn) {
      var id = btn.getAttribute("data-kirim-tidak");
      var ta = document.getElementById("teks-alasan-" + id);
      ta.addEventListener("input", function () { btn.disabled = !ta.value.trim(); });
      btn.addEventListener("click", function () {
        btn.disabled = true;
        Util.fetchJson("/api/persetujuan/" + id + "/tidak", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ alasan: ta.value.trim() }),
        }).then(function (r) {
          tampilPesan(id, "Ditolak: " + Util.esc(r.alasan), true);
          setTimeout(muat, 2000);
        }).catch(function (e) { btn.disabled = false; tampilPesan(id, e.message || "gagal menolak", false); });
      });
    });
  }

  muat();
})();
</script>
</body>
</html>
